<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; views swap on the hash. */
:root {
  --paper: #f3f5f8; --card: #ffffff; --ink: #18202e; --muted: #5d6679; --line: #dce1e9;
  --sakura: #d9466f; --sakura-soft: #fbe3ea; --celadon: #3f8f7f; --celadon-soft: #dcefe9; --seal: #c3352b;
  --c-seoul: #3f8f7f; --c-gyeongju: #a77a1f; --c-busan: #2c6db8; --c-hirosaki: #d9466f; --c-tokyo: #5b52c4;
  --shadow: 0 1px 2px rgba(24,32,46,.06), 0 6px 18px rgba(24,32,46,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cjk: "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans KR", "Noto Sans JP", "Malgun Gothic", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151d; --card: #1a202b; --ink: #edf0f6; --muted: #9ba4b7; --line: #2a3140;
  --sakura: #f27a9b; --sakura-soft: #3a1f29; --celadon: #74c3b0; --celadon-soft: #1b3330; --seal: #ec5d50;
  --c-seoul: #74c3b0; --c-gyeongju: #d7a948; --c-busan: #6aa6ec; --c-hirosaki: #f27a9b; --c-tokyo: #9a92f0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11151d; --card: #1a202b; --ink: #edf0f6; --muted: #9ba4b7; --line: #2a3140;
  --sakura: #f27a9b; --sakura-soft: #3a1f29; --celadon: #74c3b0; --celadon-soft: #1b3330; --seal: #ec5d50;
  --c-seoul: #74c3b0; --c-gyeongju: #d7a948; --c-busan: #6aa6ec; --c-hirosaki: #f27a9b; --c-tokyo: #9a92f0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2.1rem; line-height: 1.05; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); }
.top .wrap { padding-block: 10px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.who { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px 5px 6px; display: flex; align-items: center; gap: 7px; font-size: .85rem; font-weight: 600; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .75rem; font-weight: 700; flex: none; }
.sync { padding: 5px 9px; position: relative; } .sync svg { width: 20px; height: 20px; }
.sdot { position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--card); }
.av-Keren { background: var(--c-busan); } .av-Gabush { background: var(--sakura); }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 600; border-radius: 12px; }
nav.tabs a svg { width: 23px; height: 23px; }
nav.tabs a[aria-current="page"] { color: var(--sakura); }

/* hero */
.hero { padding: 6px 0 2px; display: flex; flex-direction: column; gap: 8px; }
.big-count { font-family: var(--f-display); font-weight: 800; font-size: 4.6rem; line-height: .9; letter-spacing: -0.04em; color: var(--sakura); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 600; background: var(--line); color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.clock { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.clock b { font-family: var(--f-display); font-size: 1.5rem; display: block; line-height: 1.1; }

/* route */
.route svg { width: 100%; height: auto; display: block; overflow: visible; }
.route text { font: 600 10.5px var(--f-body); fill: var(--muted); }
.route .cur { fill: var(--ink); font-weight: 700; }

/* day */
.slot { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 11px 0; border-top: 1px dashed var(--line); }
.slot:first-of-type { border-top: 0; }
.slot .when { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.travel { background: var(--celadon-soft); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; }
.travel svg { flex: none; width: 20px; height: 20px; color: var(--celadon); margin-top: 2px; }
.maplinks { display: flex; flex-wrap: wrap; gap: 6px; }
.maplinks a { font-size: .8rem; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--paper); }
.daynav { display: flex; justify-content: space-between; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: .9rem; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--sakura); border-color: var(--sakura); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
textarea, input[type=text], input[type=number], select { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 64px; }
.moment { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.moment p { white-space: pre-wrap; overflow-wrap: anywhere; }

/* plan list */
.city-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 8px; }
.city-h h2 { display: flex; align-items: baseline; gap: 8px; }
.city-h .cjk { font-family: var(--f-cjk); font-size: .95rem; color: var(--muted); font-weight: 500; }
.dayrow { display: grid; grid-template-columns: 46px 1fr 14px; gap: 12px; align-items: center; padding: 12px 14px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.dayrow:first-child { border-top: 0; }
.dayrow .d { text-align: center; line-height: 1.05; }
.dayrow .d b { font-family: var(--f-display); font-size: 1.35rem; display: block; }
.dayrow .d span { font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dayrow.today { background: var(--sakura-soft); }
.list { padding: 0; overflow: hidden; }

/* stamps */
.stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stamp { border: 1px dashed var(--line); background: var(--card); border-radius: 16px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.seal { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-cjk); font-size: 1.75rem; font-weight: 700; color: var(--line); border: 2.5px solid var(--line); transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
.stamp.got { border-style: solid; }
.stamp.got .seal { color: var(--seal); border-color: var(--seal); transform: rotate(-9deg); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4.5px var(--seal); }
.stamp .lbl { font-size: .78rem; font-weight: 600; line-height: 1.25; }
.stamp .by { font-size: .68rem; color: var(--muted); min-height: 1em; }
.meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--celadon), var(--sakura)); border-radius: 999px; transition: width .6s; }

/* money */
.balance { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
.form-grid { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.exp { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.exp:first-child { border-top: 0; }
.exp .amt { text-align: right; font-weight: 600; }
.x { border: 0; background: none; color: var(--muted); font-size: .75rem; padding: 2px 0; }
.conv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.conv div { background: var(--paper); border-radius: 12px; padding: 8px 10px; }
.conv b { display: block; font-size: 1.05rem; }

/* phrases */
.phrase { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.phrase:first-child { border-top: 0; }
.phrase .native { font-family: var(--f-cjk); font-size: 1.2rem; font-weight: 600; }
.phrase .rom { color: var(--sakura); font-weight: 600; font-size: .88rem; }
.phrase .show { grid-row: 1 / span 3; grid-column: 2; align-self: center; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.showcard { position: fixed; inset: 0; z-index: 20; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.showcard .native { font-family: var(--f-cjk); font-size: clamp(2.2rem, 11vw, 4.5rem); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--celadon); margin: 2px 0 0; }
.check.done span { color: var(--muted); text-decoration: line-through; }
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(10,14,22,.45); display: grid; place-items: end center; }
.sheet .card { width: min(560px, 100%); border-radius: 22px 22px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button { border: 1px solid var(--line); background: var(--paper); border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; }
.pick .avatar { width: 44px; height: 44px; font-size: 1.1rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: .85rem; font-weight: 600; z-index: 40; }
#petals { position: fixed; inset: 0; pointer-events: none; z-index: 35; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .seal, .meter i { transition: none; } }
</style>

<script>
/* ---------------- Trip data ---------------- */
const START = "2027-04-13", END = "2027-04-29";

const CITIES = {
  seoul:    { name: "Seoul", cjk: "서울", kr: true, from: "2027-04-13", to: "2027-04-18", stay: "Jongno / Anguk", weather: "Typical April: highs about 19°C, lows about 7°C, mostly dry and sunny.", food: "Mung-bean pancakes at Gwangjang, pork-belly barbecue, hand-cut noodle soup, fried chicken and beer.", tip: "Use Naver Map or Kakao Map. Google Maps barely works for walking and transit in Korea." },
  gyeongju: { name: "Gyeongju", cjk: "경주", kr: true, from: "2027-04-18", to: "2027-04-20", stay: "Hwangridan-gil hanok", weather: "Typical April: highs about 20°C, cool evenings around 8°C.", food: "Hwangnam bread (red-bean pastry) and ssambap, rice with a dozen leaf wraps.", tip: "Rent bikes near the tombs. The centre is flat and easy." },

function petals(n = 46) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#petals"); c.hidden = false; const dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; const x = c.getContext("2d"); x.scale(dpr, dpr);
  const col = getComputedStyle(document.documentElement).getPropertyValue("--sakura").trim() || "#d9466f";
  const ps = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, r: 5 + Math.random() * 5, vy: 1.4 + Math.random() * 1.8, vx: -.6 + Math.random() * 1.2, a: Math.random() * 6, va: -.06 + Math.random() * .12, ph: Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t) {
    const el = t - t0; x.clearRect(0, 0, innerWidth, innerHeight);
    x.globalAlpha = Math.max(0, Math.min(1, (3200 - el) / 600));
    ps.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin((t / 400) + p.ph) * .7; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = col;
      x.beginPath(); x.moveTo(0, -p.r); x.bezierCurveTo(p.r, -p.r, p.r * .8, p.r * .6, 0, p.r); x.bezierCurveTo(-p.r * .8, p.r * .6, -p.r, -p.r, 0, -p.r); x.fill(); x.restore(); });
    if (el < 3200) requestAnimationFrame(f); else { x.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}
let toastT;
function toast(msg) { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

function routeSvg(curCity, progress) {
  const xs = [14, 92, 160, 250, 326];
  const idx = curCity ? CITY_ORDER.indexOf(curCity) : -1;
  let s = `<svg viewBox="0 0 340 62" role="img" aria-label="Route: Seoul, Gyeongju, Busan, Hirosaki, Tokyo">`;
  s += `<line x1="14" y1="20" x2="160" y2="20" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`;
  s += `<line x1="160" y1="20" x2="250" y2="20" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round"/>`;
  s += `<line x1="250" y1="20" x2="326" y2="20" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>`;
  s += `<path d="M199 13.5l7 6.5-7 6.5M201 20h-8" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (progress > 0) {
    const px = 14 + (326 - 14) * Math.min(1, progress);
    s += `<line x1="14" y1="20" x2="${px}" y2="20" stroke="var(--sakura)" stroke-width="4" stroke-linecap="round" opacity=".85"/>`;
  }
  CITY_ORDER.forEach((c, i) => {
    const on = i === idx;
    s += `<circle cx="${xs[i]}" cy="20" r="${on ? 9 : 6}" fill="${on ? `var(--c-${c})` : "var(--card)"}" stroke="var(--c-${c})" stroke-width="3"/>`;
    s += `<text x="${xs[i]}" y="48" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}" class="${on ? "cur" : ""}" dx="${i === 0 ? -6 : i === 4 ? 6 : 0}">${CITIES[c].name}</text>`;
  });
  return s + `</svg>`;
}

  <details class="card"><summary><b>Exchange rates</b> <span class="small muted">· per ₪1, shared by both phones</span></summary>
    <div class="stack" style="gap:8px;margin-top:10px">
      ${["KRW", "JPY", "USD"].map(c => `<label class="form-grid" style="align-items:center"><span>${c} per ₪1</span><input type="number" step="any" inputmode="decimal" data-rate="${c}" value="${r[c]}"></label>`).join("")}
      <p class="small muted">Defaults are rough estimates. Update them with the real rate when you land.</p></div></details>
  ${shareNote()}`;
}

let phraseLang = ls.get("lang", null);
function viewPhrases() {
  const t = todayLocal(); const d = DAYS.find(x => x.date === t);
  const lang = phraseLang || (d && !CITIES[d.city].kr ? "ja" : "ko");
  return `<section class="hero"><span class="eyebrow">Say it like a local</span><h1>${lang === "ko" ? "Korean" : "Japanese"} phrases</h1>
    <p class="muted">Tap any phrase to show it full screen to the person you're talking to.</p></section>
  <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ko" aria-pressed="${lang === "ko"}">한국어 Korean</button><button type="button" data-lang="ja" aria-pressed="${lang === "ja"}">日本語 Japanese</button></div>
  <div class="card" style="padding-block:4px">${PHRASES[lang].map(([en, n, rom], i) => `<button class="phrase" type="button" data-show="${lang}:${i}"><span class="small muted">${esc(en)}</span><span class="native">${n}</span><span class="rom">${rom}</span><span class="show">Show</span></button>`).join("")}</div>
  <div class="card stack" style="gap:6px"><h3>Emergency numbers</h3>
    <p class="tnum"><b>Korea:</b> police 112 · ambulance 119 · English travel hotline 1330</p>
    <p class="tnum"><b>Japan:</b> police 110 · ambulance 119</p>
    <p class="small muted">Taxis with a recorded trip: Kakao T in Korea, GO or Uber in Japan.</p></div>`;
}

function showPhrase(lang, i) { const [en, n, rom] = PHRASES[lang][i]; showCard(n, rom, en); }
function showCard(n, rom, en, latin) {
  const s = document.createElement("div"); s.className = "showcard"; s.setAttribute("role", "dialog"); s.setAttribute("aria-label", en);
  s.innerHTML = `<div class="native" ${latin ? 'style="font-family:var(--f-display);font-size:clamp(1.8rem,8vw,3rem)"' : ""}>${esc(n)}</div><div style="font-size:1.2rem;color:var(--sakura);font-weight:600">${esc(rom)}</div><div class="muted">${esc(en)}</div><button class="btn" type="button">Close</button>`;
  s.onclick = () => s.remove(); document.body.append(s); s.querySelector("button").focus();
}

/* ---------------- router ---------------- */
function render() {
  const h = (location.hash || "#today").slice(1);
  let tab = h, html;
  if (h.startsWith("day-")) { const d = DAYS.find(x => x.date === h.slice(4)); tab = "plan"; html = d ? dayCard(d, { isToday: d.date === todayLocal() }) : viewPlan(); }
  else html = ({ today: viewToday, plan: viewPlan, stamps: viewStamps, money: viewMoney, phrases: viewPhrases }[h] || viewToday)();
  const v = $("#view");
  const active = document.activeElement; const keep = active && active.id && v.contains(active) ? { id: active.id, val: active.value, s: active.selectionStart } : null;
  v.innerHTML = `<div class="stack">${html}</div>`;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.val; el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch {} } }
  const cur = ["today", "plan", "stamps", "money", "phrases"].includes(tab) ? tab : "today";
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === cur) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
let lastHash = location.hash;
addEventListener("hashchange", () => { render(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });

/* ---------------- interactions ---------------- */
document.addEventListener("click", e => {
  const st = e.target.closest("[data-stamp]");
  if (st) {
    const id = st.dataset.stamp;
    if (Store.get("stamps", id)) { Store.del("stamps", id); toast("Stamp removed"); }
    else { Store.set("stamps", id, { by: who || "", date: todayLocal(), ts: Date.now() }); petals(); const n = STAMPS.filter(s => Store.get("stamps", s.id)).length; toast(n === STAMPS.length ? "Full stamp book. Legends." : "Stamped!"); }
    render(); return;
  }
  const sp = e.target.closest("[data-split]"); if (sp) { expForm.split = sp.dataset.split; ls.set("expForm", expForm); render(); return; }
  const lg = e.target.closest("[data-lang]"); if (lg) { phraseLang = lg.dataset.lang; ls.set("lang", phraseLang); render(); return; }
  const ht = e.target.closest("[data-hotel]"); if (ht) { const h = HOTELS[ht.dataset.hotel]; showCard(h.name, h.address, ht.dataset.hotel === "hirosaki" || ht.dataset.hotel === "tokyo" ? "Please take us to this hotel. ありがとうございます" : "Please take us to this hotel. 감사합니다", true); return; }
  const sh = e.target.closest("[data-show]"); if (sh) { const [l, i] = sh.dataset.show.split(":"); showPhrase(l, +i); return; }
  const dx = e.target.closest("[data-delexp]");
  if (dx) {
    if (dx.dataset.confirm) { Store.del("expenses", dx.dataset.delexp); toast("Expense removed"); render(); }
    else { dx.dataset.confirm = "1"; dx.textContent = "tap again to remove"; setTimeout(() => { if (dx.isConnected) { delete dx.dataset.confirm; dx.textContent = "remove"; } }, 3000); }
  }
});
document.addEventListener("change", e => {
  const p = e.target.closest("[data-prep]");
  if (p) { const done = p.checked; Store.set("prep", p.dataset.prep, { done, by: done ? who || "" : "", ts: Date.now() }); if (done && PREP.every(x => Store.get("prep", x.id)?.done)) petals(80); render(); return; }
  const r = e.target.closest("[data-rate]");
  if (r) { const v = parseFloat(r.value); if (v > 0) { Store.set("settings", "rates", { ...rates(), [r.dataset.rate]: v }); toast("Rate saved"); render(); } return; }
  if (e.target.id === "expCur") { expForm.cur = e.target.value; ls.set("expForm", expForm); }
  if (e.target.id === "convCur") { convAmt.cur = e.target.value; ls.set("convAmt", convAmt); render(); }
  const m = e.target.closest("[data-mom]");
  if (m) { const text = m.value.trim().slice(0, 600); Store.set("journal", m.dataset.mom + "_" + who, { text, by: who, ts: Date.now() }); toast("Moment saved"); }
});
document.addEventListener("input", e => {
  if (e.target.id === "convAmt") {
    convAmt.amt = e.target.value; ls.set("convAmt", convAmt);
    const ci = toILS(Number(convAmt.amt) || 0, convAmt.cur), r = rates();
    $("#convOut").innerHTML = ["ILS", "KRW", "JPY", "USD"].filter(x => x !== convAmt.cur).map(c => `<div><span class="small muted">${c}</span><b>${fmtMoney(c === "ILS" ? ci : ci * r[c], c)}</b></div>`).join("");
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "expAdd") return; e.preventDefault();
  if (!who) { pickWho(); return; }
  const desc = $("#expDesc").value.trim(), amount = parseFloat($("#expAmt").value), cur = $("#expCur").value;
  if (!desc || !(amount > 0)) { toast("Add a description and an amount"); return; }
  Store.set("expenses", uid(), { desc: desc.slice(0, 80), amount, cur, paidBy: who, split: expForm.split, date: todayLocal(), ts: Date.now() });
  expForm.cur = cur; ls.set("expForm", expForm); toast("Added"); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".showcard").forEach(s => s.remove()); });

renderWho(); render();
if (!who) setTimeout(pickWho, 400);
Store.init();
Sync.init();
setInterval(() => { if (!document.hidden && (location.hash || "#today") === "#today" && !document.activeElement?.matches("textarea,input")) render(); }, 60000);
</script>

</body>
</html>
